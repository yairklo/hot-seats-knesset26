<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>מקומות חמים בסקרים</title>
<style>
:root{
  --bg:#F5F4F9;--panel:#FFFFFF;--ink:#1D1A33;--ink2:#56526E;--muted:#8A86A0;--line:#E3E1EE;
  --f:#534AB7;--fbg:#EEEDFE;--fink:#3C3489;
  --m:#0F6E56;--mbg:#E1F5EE;--mink:#085041;
  --u:#A1560B;--ubg:#FFF3E0;
  --in:#534AB7;--inbg:#EEEDFE;--out:#B4B2A9;--outbg:#F1EFE8;
  --safe:#26215C;--seat:#FAEEDA;--seatline:#EF9F27;
  --warn:#8A4A07;--warnbg:#FFF3E0;--warnline:#F5C37A;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Arial,"Noto Sans Hebrew",sans-serif;font-size:15px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding:24px 16px 56px;display:flex;flex-direction:column;gap:18px}
h1{font-size:26px;margin:0}
h2{font-size:19px;margin:0}
.sub{color:var(--ink2);margin:4px 0 0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.controls{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end}
.ctl{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--ink2)}
select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:240px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;background:var(--panel)}
.seg button{border:0;border-radius:7px;padding:6px 14px;background:transparent;font:inherit;font-size:14px;cursor:pointer;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
button.exp{font:inherit;font-size:13.5px;font-weight:600;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer}
button.exp:hover{border-color:var(--f)}
button:focus-visible,select:focus-visible{outline:2px solid var(--f);outline-offset:2px}
.vhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.capture{background:var(--panel);padding:4px}
.warns{background:var(--warnbg);border:1px solid var(--warnline);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:13.5px}
.warns ul{margin:6px 0 0;padding-inline-start:18px}
.warns:empty{display:none}

.totals{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-bottom:14px}
.tot{border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.tot .lbl{font-size:12.5px;color:var(--ink2)}
.tot .nums{display:flex;gap:14px;flex-wrap:wrap;margin-top:4px;font-variant-numeric:tabular-nums}
.tot b{font-size:22px}
.cf{color:var(--f)} .cm{color:var(--m)} .cu{color:var(--u)}

.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--ink2);margin-bottom:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:3px;display:inline-block}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:12px;padding:12px 14px;break-inside:avoid}
.card h3{margin:0;font-size:16.5px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.seats{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.exact{font-size:12px;color:var(--muted);font-weight:400;margin-inline-start:4px}
.counts{font-size:12.5px;color:var(--ink2);margin:6px 0 8px;display:grid;grid-template-columns:auto 1fr;gap:2px 8px;font-variant-numeric:tabular-nums}
.counts .k{color:var(--muted)}
.cand{display:grid;grid-template-columns:30px minmax(0,1fr) auto auto;align-items:center;gap:8px;padding:5px 6px;border-radius:6px;font-size:14px}
.cand.e1{background:#FBF7EE}
.cand .pos{font-variant-numeric:tabular-nums;color:var(--ink2);font-weight:600;text-align:center}
.cand.dim{opacity:.28}
.tag{font-size:11.5px;font-weight:600;border-radius:20px;padding:1px 8px;white-space:nowrap}
.tag.F{background:var(--fbg);color:var(--fink)}
.tag.M{background:var(--mbg);color:var(--mink)}
.tag.U{background:var(--ubg);color:var(--u);border:1px dashed var(--u)}
.st{font-size:11.5px;border-radius:4px;padding:1px 7px;white-space:nowrap}
.st.in{background:var(--inbg);color:var(--fink)}
.st.out{background:var(--outbg);color:#5F5E5A}
.cutline{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--seatline);margin:2px 0;font-weight:600}
.cutline::before,.cutline::after{content:"";flex:1;border-top:2px dashed var(--seatline)}
.missing{font-size:12.5px;color:var(--warn);background:var(--warnbg);border-radius:6px;padding:4px 8px;margin-top:3px}
.below{font-size:13px;color:var(--ink2);margin-top:12px}

.tablewrap{overflow-x:auto}
table.cmp{border-collapse:separate;border-spacing:0;font-size:13px;font-variant-numeric:tabular-nums}
.cmp th,.cmp td{padding:4px 6px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
.cmp th{font-weight:600;color:var(--ink2);font-size:12px;position:sticky;top:0;background:var(--panel)}
.cmp td.name{text-align:right;min-width:170px}
.cmp tr.party td{background:#F1EFF8;font-weight:700;text-align:right;color:var(--ink)}
.cmp tr.party td.sn{text-align:center;font-weight:600;color:var(--ink2)}
.cell{display:inline-block;width:26px;height:20px;border-radius:4px;line-height:20px;font-size:11px;font-weight:700}
.c-safe{background:var(--safe);color:#fff}
.c-in{background:var(--in);color:#fff}
.c-hot{background:#CECBF6;color:var(--fink)}
.c-out{background:var(--outbg);color:#888780}
.c-na{background:repeating-linear-gradient(45deg,#fff 0 3px,#eee 3px 6px);color:#aaa}
.cmp td.avgcol,.cmp th.avgcol{border-inline-start:2px solid var(--ink2)}
.foot{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.6}
@media (max-width:560px){select{min-width:0;width:100%}.ctl{flex:1 1 100%}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>מקומות חמים בסקרים</h1>
    <p class="sub">מי מהמועמדים לכנסת ה-26 נמצא סביב קו המנדטים, לפי כל סקר ולפי ממוצע הסקרים.</p>
  </header>

  <div class="warns" id="loadErr" hidden></div>

  <section class="panel controls" aria-label="בחירת תצוגה">
    <label class="ctl" for="src">מקור
      <select id="src"></select>
    </label>
    <div class="ctl">מגדר
      <div class="seg" role="group" aria-label="מסנן מגדר">
        <button type="button" data-g="all" aria-pressed="true">הכול</button>
        <button type="button" data-g="F" aria-pressed="false">נשים</button>
        <button type="button" data-g="M" aria-pressed="false">גברים</button>
      </div>
    </div>
  </section>

  <div class="warns" id="warns"></div>

  <section class="panel" aria-labelledby="h1v">
    <div class="vhead"><h2 id="h1v">לפי מפלגה</h2><button type="button" class="exp" data-target="capParties" data-name="מפלגות">ייצוא לתמונה (PNG)</button></div>
    <div class="capture" id="capParties"></div>
  </section>

  <section class="panel" aria-labelledby="h2v">
    <div class="vhead"><h2 id="h2v">השוואה בין הסקרים</h2><button type="button" class="exp" data-target="capCompare" data-name="השוואה">ייצוא לתמונה (PNG)</button></div>
    <div class="tablewrap"><div class="capture" id="capCompare"></div></div>
  </section>
</div>
<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
<script src="app.js"></script>
</body>
</html>
